<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f3" />
    <title>当前离线</title>
    <style>
      :root {
        --bg: #f7f6f3;
        --fg: #171512;
        --muted: #6f6a63;
        --line: rgba(23, 21, 18, 0.12);
        --accent: #a05b0c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #13110f;
          --fg: #efeae3;
          --muted: #a29b91;
          --line: rgba(239, 234, 227, 0.14);
          --accent: #c77c1f;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 360px;
        border: 1px solid var(--line);
        padding: 40px 32px;
        text-align: center;
      }
      .mark {
        width: 14px;
        height: 14px;
        margin: 0 auto 24px;
        background: var(--accent);
        transform: rotate(45deg);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>当前离线</h1>
      <p>网络恢复后重新加载即可继续。</p>
    </main>
  </body>
</html>
