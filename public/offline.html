<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>当前离线</title>
    <script>
      // 与后台入口一致：按记忆值落定 data-theme，让原生配色随主题。
      (function () {
        try {
          var pref = localStorage.getItem('admin_theme');
          if (pref !== 'light' && pref !== 'dark' && pref !== 'auto') pref = 'auto';
          var dark =
            pref === 'dark' ||
            (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          if (pref === 'auto') el.removeAttribute('data-theme');
          else el.setAttribute('data-theme', pref);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', dark ? 'dark light' : 'light dark');
        } catch (e) {
          /* localStorage 不可用时退回系统偏好 */
        }
      })();
    </script>
    <style>
      /* 离线兜底页不加载 antd：颜色取浏览器系统色（随 color-scheme 自动适配深浅）。 */
      html {
        color-scheme: light;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: Canvas;
        color: CanvasText;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Noto Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 360px;
        border: 1px solid ButtonBorder;
        padding: 40px 32px;
        text-align: center;
      }
      .mark {
        width: 14px;
        height: 14px;
        margin: 0 auto 24px;
        background: AccentColor;
        transform: rotate(45deg);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: GrayText;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>当前离线</h1>
      <p>网络恢复后重新加载即可继续。</p>
    </main>
  </body>
</html>
