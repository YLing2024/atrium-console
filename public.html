<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>应用中心</title>
    <script>
      // 首屏防闪白：在任何样式 / 脚本前按记忆值落定 <html data-theme> 与 color-scheme。
      (function () {
        try {
          var pref = localStorage.getItem('admin_theme');
          if (pref !== 'light' && pref !== 'dark' && pref !== 'auto') pref = 'auto';
          var dark =
            pref === 'dark' ||
            (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          if (pref === 'auto') el.removeAttribute('data-theme');
          else el.setAttribute('data-theme', pref);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', dark ? 'dark light' : 'light dark');
        } catch (e) {
          /* localStorage 不可用时退回系统偏好 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/publicApps.tsx"></script>
  </body>
</html>
